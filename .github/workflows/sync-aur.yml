name: Sync NymVPN beta to AUR

on:
  schedule:
    - cron: '0 0 * * *'   # Raz na 24h
  workflow_dispatch:       # Ręczne uruchomienie

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Znajdź najnowszy release pre-release
        id: latest
        run: |
          # Pobieramy najnowszy pre-release z API wydań
          TAG=$(curl -s "https://api.github.com/repos/nymtech/nym-vpn-client/releases" \
            | jq -r '[.[] | select(.prerelease == true and .draft == false)][0].tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Nie znaleziono wydania pre-release" >&2
            exit 1
          fi

          # Wyciągamy pkgver (np. 2026.12.3) i pkgrel (np. 1 z beta.1)
          PKGVER=$(echo "$TAG" | sed -E 's/^nym-vpn-v([0-9.]+)-beta\.([0-9]+)$/\1/')
          PKGREL=$(echo "$TAG" | sed -E 's/^nym-vpn-v([0-9.]+)-beta\.([0-9]+)$/\2/')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL" >> "$GITHUB_OUTPUT"

      - name: Porównaj z aktualnym PKGBUILD
        id: compare
        run: |
          NEW_VER="${{ steps.latest.outputs.pkgver }}"
          NEW_REL="${{ steps.latest.outputs.pkgrel }}"

          CUR_VER=$(grep '^pkgver=' nym-vpn-app-beta-bin/PKGBUILD | cut -d= -f2 | tr -d "'\" ")
          CUR_REL=$(grep '^pkgrel=' nym-vpn-app-beta-bin/PKGBUILD | cut -d= -f2 | tr -d "'\" ")

          if [ "$CUR_VER" = "$NEW_VER" ] && [ "$CUR_REL" = "$NEW_REL" ]; then
            echo "Wersja w PKGBUILD ($CUR_VER-$CUR_REL) jest aktualna."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Wykryto nową wersję: $NEW_VER-$NEW_REL (obecna: $CUR_VER-$CUR_REL)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zaktualizuj PKGBUILDy
        if: steps.compare.outputs.changed == 'true'
        run: |
          PKGVER="${{ steps.latest.outputs.pkgver }}"
          PKGREL="${{ steps.latest.outputs.pkgrel }}"

          DIRS=("nym-vpn-app-beta-bin" "nym-vpnd-beta-bin")

          for dir in "${DIRS[@]}"; do
            sed -i "s/^pkgver=.*/pkgver=$PKGVER/" "$dir/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=$PKGREL/" "$dir/PKGBUILD"
          done

      - name: Przelicz sumy b2 i wygeneruj .SRCINFO
        if: steps.compare.outputs.changed == 'true'
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -c "
            pacman -Sy --noconfirm pacman-contrib &&
            useradd -m builder && chown -R builder -R /pkg &&
            for dir in nym-vpn-app-beta-bin nym-vpnd-beta-bin; do
              cd /pkg/\$dir
              su builder -c 'SRCDEST=/tmp updpkgsums && makepkg --printsrcinfo > .SRCINFO'
            done
          "
          sudo chown -R $USER:$USER .

      - name: Commit i push do repo GitHub
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nym-vpn-app-beta-bin/PKGBUILD nym-vpn-app-beta-bin/.SRCINFO \
                  nym-vpnd-beta-bin/PKGBUILD nym-vpnd-beta-bin/.SRCINFO
          git commit -m "Update to ${{ steps.latest.outputs.tag }}"
          git push

      - name: Publikuj nym-vpnd-beta-bin w AUR
        if: steps.compare.outputs.changed == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: nym-vpnd-beta-bin
          pkgbuild: ./nym-vpnd-beta-bin/PKGBUILD
          assets: nym-vpnd-beta-bin/nym-vpnd.service
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.latest.outputs.tag }} (auto)"

      - name: Publikuj nym-vpn-app-beta-bin w AUR
        if: steps.compare.outputs.changed == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: nym-vpn-app-beta-bin
          pkgbuild: ./nym-vpn-app-beta-bin/PKGBUILD
          assets: |
            nym-vpn-app-beta-bin/nym-vpn.desktop
            nym-vpn-app-beta-bin/nym-vpn.svg
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.latest.outputs.tag }} (auto)"
