name: Sync NymVPN nightly to AUR

on:
  schedule:
    - cron: '0 0 * * *'   # Raz na 24h (codziennie o 00:00 UTC)
  workflow_dispatch:       # Ręczne uruchomienie

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Znajdź najnowszy tag nightly
        id: latest
        run: |
          TAG=$(curl -s "https://api.github.com/repos/nymtech/nym-vpn-client/tags?per_page=30" \
            | jq -r '[.[] | select(.name | test("^nym-vpn-v[0-9.]+-nightly\\.[0-9]+$"))][0].name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Nie znaleziono taga nightly" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Porównaj z aktualnym PKGBUILD
        id: compare
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          CUR_VER=$(grep '^pkgver=' nym-vpn-app-nightly-bin/PKGBUILD | cut -d= -f2)
          CUR_REL=$(grep '^pkgrel=' nym-vpn-app-nightly-bin/PKGBUILD | cut -d= -f2)
          CUR_TAG="nym-vpn-v${CUR_VER}-nightly.${CUR_REL}"

          if [ "$CUR_TAG" = "$TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zaktualizuj PKGBUILDy
        if: steps.compare.outputs.changed == 'true'
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          PKGVER=$(echo "$TAG" | sed -E 's/^nym-vpn-v([0-9.]+)-nightly\.([0-9]+)$/\1/')
          PKGREL=$(echo "$TAG" | sed -E 's/^nym-vpn-v([0-9.]+)-nightly\.([0-9]+)$/\2/')

          DIRS=("nym-vpn-app-nightly-bin" "nym-vpnd-nightly-bin")

          for dir in "${DIRS[@]}"; do
            sed -i "s/^pkgver=.*/pkgver=$PKGVER/" "$dir/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=$PKGREL/" "$dir/PKGBUILD"
          done

      - name: Przelicz sumy b2 i wygeneruj .SRCINFO
        if: steps.compare.outputs.changed == 'true'
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -c "
            pacman -Sy --noconfirm pacman-contrib &&
            useradd -m builder && chown -R builder /pkg &&
            for dir in nym-vpn-app-nightly-bin nym-vpnd-nightly-bin; do
              cd /pkg/\$dir
              su builder -c 'updpkgsums && makepkg --printsrcinfo > .SRCINFO'
            done
          "
          sudo chown -R $USER:$USER .

      - name: Commit i push do repo GitHub
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nym-vpn-app-nightly-bin/PKGBUILD nym-vpn-app-nightly-bin/.SRCINFO nym-vpnd-nightly-bin/PKGBUILD nym-vpnd-nightly-bin/.SRCINFO
          git commit -m "Update to ${{ steps.latest.outputs.tag }}"
          git push

  publish-aur:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [nym-vpn-app-nightly-bin, nym-vpnd-nightly-bin]
    steps:
      - uses: actions/checkout@v4

      - name: Publikuj ${{ matrix.package }} w AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ./${{ matrix.package }}/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.update.outputs.tag }} (auto)"
